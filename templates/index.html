<script>

let progressTimer = null;


/* =========================================================
   ANALYZE
========================================================= */

async function analyze() {

    const links =
        document.getElementById("linksInput").value.trim();

    const resultsDiv =
        document.getElementById("results");

    const loadingDiv =
        document.getElementById("loading");

    const btn =
        document.getElementById("analyzeBtn");


    if (!links) {

        alert("لطفاً حداقل یک لینک وارد کنید.");

        return;
    }


    loadingDiv.classList.remove("hidden");

    resultsDiv.innerHTML = "";

    btn.disabled = true;

    btn.classList.add("opacity-50");


    try {

        const response =
            await fetch(
                "/analyze",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        links: links
                    })
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP Error " +
                response.status
            );
        }


        const data =
            await response.json();


        if (
            data.items &&
            data.items.length > 0
        ) {

            data.items.forEach(
                item => {

                    const card =
                        document.createElement("div");


                    card.className =
                        "bg-gray-900 p-4 rounded-xl flex flex-col sm:flex-row items-center gap-4 border border-gray-700";


                    card.innerHTML = `

                        ${
                            item.thumbnail
                            ?
                            `
                            <img
                                src="${escapeHtml(item.thumbnail)}"
                                class="w-40 h-24 object-cover rounded-lg"
                                alt="thumbnail"
                            >
                            `
                            :
                            `
                            <div class="w-40 h-24 bg-gray-700 rounded-lg flex items-center justify-center text-gray-400">
                                بدون تصویر
                            </div>
                            `
                        }


                        <div class="flex-1 w-full">

                            <h3
                                class="font-semibold text-sm mb-2"
                            >
                                ${escapeHtml(item.title || "بدون عنوان")}
                            </h3>


                            ${
                                item.url
                                ?
                                `
                                <p class="text-xs text-gray-500 break-all mb-2">
                                    ${escapeHtml(item.url)}
                                </p>
                                `
                                :
                                ""
                            }


                            ${
                                item.direct_download_url
                                ?
                                `
                                <a
                                    href="${escapeHtml(item.direct_download_url)}"
                                    target="_blank"
                                    download
                                    class="inline-block bg-green-600 hover:bg-green-500 text-xs px-4 py-2 rounded-lg font-bold transition"
                                >
                                    📥 دانلود مستقیم
                                </a>
                                `
                                :
                                `
                                <span class="text-yellow-400 text-xs">
                                    لینک دانلود مستقیم هنوز موجود نیست
                                </span>
                                `
                            }

                        </div>
                    `;


                    resultsDiv.appendChild(card);

                }
            );

        }

        else {

            resultsDiv.innerHTML = `
                <p class="text-center text-gray-400">
                    نتیجه‌ای یافت نشد.
                </p>
            `;

        }


    }

    catch (error) {

        console.error(error);


        resultsDiv.innerHTML = `
            <div class="bg-red-900/40 border border-red-700 p-4 rounded-xl text-red-300">
                خطا در ارتباط با سرور.
                <br>
                <small>
                    ${escapeHtml(error.message)}
                </small>
            </div>
        `;

    }


    finally {

        loadingDiv.classList.add("hidden");

        btn.disabled = false;

        btn.classList.remove("opacity-50");

    }

}


/* =========================================================
   START DOWNLOAD
========================================================= */

async function startDownload() {

    const links =
        document
            .getElementById("linksInput")
            .value
            .trim();


    const quality =
        document
            .getElementById("quality")
            .value;


    if (!links) {

        alert(
            "لطفاً ابتدا حداقل یک لینک وارد کنید."
        );

        return;
    }


    try {

        const response =
            await fetch(
                "/start",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        links: links,

                        quality: quality,

                        ffmpeg: ""

                    })
                }
            );


        const data =
            await response.json();


        if (!data.ok) {

            alert(
                data.msg ||
                "خطا در شروع دانلود"
            );

            return;
        }


        if (progressTimer) {

            clearInterval(
                progressTimer
            );

        }


        progressTimer =
            setInterval(
                getProgress,
                1000
            );


        getProgress();

    }

    catch (error) {

        console.error(error);

        alert(
            "خطا در ارتباط با سرور."
        );

    }

}


/* =========================================================
   PROGRESS
========================================================= */

async function getProgress() {

    try {

        const response =
            await fetch(
                "/progress"
            );


        if (!response.ok) {

            throw new Error(
                "خطا در دریافت وضعیت"
            );
        }


        const p =
            await response.json();


        document.getElementById(
            "status"
        ).textContent =
            "وضعیت: " +
            (p.state || "unknown");


        document.getElementById(
            "details"
        ).innerHTML = `

            <div>
                مورد:
                <b>
                    ${escapeHtml(
                        p.current_index ?? 0
                    )}
                </b>
                از
                <b>
                    ${escapeHtml(
                        p.total ?? 0
                    )}
                </b>
            </div>


            <div>
                عنوان:
                ${escapeHtml(
                    p.current_title || ""
                )}
            </div>


            <div>
                پیشرفت:
                ${escapeHtml(
                    p.percent || ""
                )}
            </div>


            <div>
                سرعت:
                ${escapeHtml(
                    p.speed || ""
                )}
            </div>


            <div>
                زمان باقی‌مانده:
                ${escapeHtml(
                    p.eta || ""
                )}
            </div>

        `;


        document.getElementById(
            "log"
        ).textContent =
            (p.log || []).join("\n");


        /* -----------------------------------------
           DOWNLOAD FINISHED
        ----------------------------------------- */

        if (
            p.state === "done" ||
            p.state === "error"
        ) {

            clearInterval(
                progressTimer
            );

            progressTimer = null;


            if (
                p.state === "done" &&
                p.filename
            ) {

                const details =
                    document.getElementById(
                        "details"
                    );


                const br =
                    document.createElement(
                        "br"
                    );


                const link =
                    document.createElement(
                        "a"
                    );


                link.href =
                    "/download?filename=" +
                    encodeURIComponent(
                        p.filename
                    );


                link.textContent =
                    "📥 دانلود فایل";


                link.target =
                    "_blank";


                link.className =
                    "inline-block mt-3 bg-green-600 hover:bg-green-500 px-4 py-2 rounded-lg font-bold";


                details.appendChild(br);

                details.appendChild(link);

            }

        }

    }

    catch (error) {

        console.error(
            "Progress error:",
            error
        );

    }

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value) {

    return String(
        value ?? ""
    ).replace(
        /[&<>"']/g,

        function(character) {

            return {

                "&": "&amp;",

                "<": "&lt;",

                ">": "&gt;",

                '"': "&quot;",

                "'": "&#039;"

            }[character];

        }
    );

}

</script>
