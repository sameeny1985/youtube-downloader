<!doctype html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Video Downloader</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            box-sizing: border-box;
            padding: 10px;
        }

        button,
        select {
            padding: 10px 16px;
            margin: 5px;
            cursor: pointer;
        }

        #items img {
            width: 160px;
            height: 90px;
            object-fit: cover;
        }

        .item {
            display: flex;
            gap: 15px;
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        #log {
            white-space: pre-wrap;
            background: #111;
            color: #eee;
            padding: 15px;
            min-height: 120px;
        }

        .row {
            margin: 15px 0;
        }

    </style>

</head>

<body>

    <h1>
        دانلود ویدئو
    </h1>


    <div class="row">

        <textarea
            id="links"
            placeholder="هر لینک را در یک خط وارد کنید"
        ></textarea>

    </div>


    <div class="row">

        <label>
            کیفیت:
        </label>

        <select id="quality">

            <option value="240">
                240p
            </option>

            <option
                value="360"
                selected
            >
                360p
            </option>

            <option value="best">
                Best
            </option>

        </select>


        <button onclick="analyze()">
            بررسی لینک‌ها
        </button>


        <button onclick="startDownload()">
            شروع دانلود
        </button>

    </div>


    <div id="items"></div>


    <div class="row">

        <strong id="status">
            وضعیت: idle
        </strong>

        <div id="details"></div>

    </div>


    <div id="log"></div>


<script>

let progressTimer = null;


async function analyze() {

    const links =
        document.getElementById(
            "links"
        ).value;


    const r =
        await fetch(
            "/analyze",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    links
                })
            }
        );


    const data =
        await r.json();


    document.getElementById(
        "items"
    ).innerHTML =
        data.items.map(x => `

            <div class="item">

                ${
                    x.thumbnail
                    ?
                    `<img
                        src="${x.thumbnail}"
                        alt=""
                    >`
                    :
                    ""
                }

                <div>

                    <div>
                        <b>
                            ${escapeHtml(
                                x.title
                            )}
                        </b>
                    </div>

                    <div>
                        ${escapeHtml(
                            x.url
                        )}
                    </div>

                </div>

            </div>

        `).join("");

}


async function startDownload() {

    const links =
        document.getElementById(
            "links"
        ).value;


    const quality =
        document.getElementById(
            "quality"
        ).value;


    const r =
        await fetch(
            "/start",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    links,

                    quality,

                    ffmpeg: ""

                })

            }
        );


    const data =
        await r.json();


    if (!data.ok) {

        alert(
            data.msg ||
            "خطا"
        );

        return;

    }


    if (progressTimer) {

        clearInterval(
            progressTimer
        );

    }


    progressTimer =
        setInterval(
            getProgress,
            1000
        );


    getProgress();

}


async function getProgress() {

    const r =
        await fetch(
            "/progress"
        );


    const p =
        await r.json();


    document.getElementById(
        "status"
    ).textContent =
        "وضعیت: " +
        p.state;


    document.getElementById(
        "details"
    ).innerHTML =

        `مورد ${
            p.current_index
        } از ${
            p.total
        } |
        ${
            escapeHtml(
                p.current_title ||
                ""
            )
        } |
        ${
            escapeHtml(
                p.percent ||
                ""
            )
        } |
        سرعت:
        ${
            escapeHtml(
                p.speed ||
                ""
            )
        } |
        زمان باقی‌مانده:
        ${
            escapeHtml(
                p.eta ||
                ""
            )
        }`;


    document.getElementById(
        "log"
    ).textContent =
        (p.log || []).join(
            "\n"
        );


    if (
        p.state === "done" ||
        p.state === "error"
    ) {

        clearInterval(
            progressTimer
        );

        progressTimer =
            null;


        if (
            p.state === "done"
        ) {

            const filename =
                p.filename ||
                "";


            if (filename) {

                const a =
                    document.createElement(
                        "a"
                    );


                a.href =
                    "/download?filename=" +
                    encodeURIComponent(
                        filename
                    );


                a.textContent =
                    "دانلود فایل";


                a.target =
                    "_blank";


                document
                    .getElementById(
                        "details"
                    )
                    .appendChild(
                        document.createElement(
                            "br"
                        )
                    );


                document
                    .getElementById(
                        "details"
                    )
                    .appendChild(
                        a
                    );

            }

        }

    }

}


function escapeHtml(s) {

    return String(s).replace(
        /[&<>"']/g,
        c => ({

            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"

        }[c])
    );

}

</script>

</body>

</html>
